schemaVersion: "2.0.0"

commandTests:
  - name: "JAVA VERSION check"
    command: "bash"
    args:
    - -c
    - |
        java -version  2>&1 | grep "openjdk version"
    expectedOutput: [".*openjdk version \"21.*"]
  - name: "TOMCAT VERSION check"
    command: "bash"
    args:
    - -c
    - |
      catalina.sh version 2>/dev/null | grep -F "Server version: "
    expectedOutput: ["Server version: Apache Tomcat/10.*"]
