schemaVersion: "2.0.0"

commandTests:
  - name: "JAVA VERSION check"
    command: "bash"
    args:
    - -c
    - |
        java -version  2>&1 | grep "OpenJDK 64-Bit Server VM Temurin"
    expectedOutput: [".*OpenJDK 64-Bit Server VM Temurin-11.*"]
  - name: "TOMCAT VERSION check"
    command: "bash"
    args:
    - -c
    - |
        env  2>&1 | grep "TOMCAT_VERSION"
    expectedOutput: ["TOMCAT_VERSION=9.*"]
  - name: "GC Reserved-Heap check"
    command: "bash"
    args:
      - -c
      - |
        rm -f /usr/local/tomcat/conf/Catalina/localhost/prweb.xml &&
        bash -c '/usr/local/tomcat/bin/catalina.sh run &' &&
        sleep 5s
    exitCode: 0
    excludedOutput: [".*-XX:G1ReservePercent=15.*"]
